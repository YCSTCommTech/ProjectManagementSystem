<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS · Comm Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --hover:#EEF2F8;
  --ink:#1B2230; --ink-2:#5D6678; --ink-3:#8A93A5; --line:#E1E6EE;
  --accent:#3845A8; --accent-soft:#E6E9FA; --accent-ink:#FFFFFF;
  --s-not:#AEB5C2; --s-work:#EE9E2F; --s-pause:#5F7F91; --s-sub:#4776E6; --s-done:#1FA466;
  --p-low:#6FA8DC; --p-med:#9A7BE0; --p-high:#E0617A;
  --danger:#D23B45; --shadow:0 12px 32px rgba(20,30,60,.16);
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151D; --surface:#1A1F2A; --surface-2:#202634; --hover:#262D3D;
    --ink:#E6E9F0; --ink-2:#A3ABBC; --ink-3:#7A8397; --line:#2C3343;
    --accent:#8390F2; --accent-soft:#2A3160; --accent-ink:#0E1220; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A1F2A; --surface-2:#202634; --hover:#262D3D;
  --ink:#E6E9F0; --ink-2:#A3ABBC; --ink-3:#7A8397; --line:#2C3343;
  --accent:#8390F2; --accent-soft:#2A3160; --accent-ink:#0E1220; --shadow:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand-mark{width:26px;height:26px;border-radius:7px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;background:var(--ink)}
.brand-mark i{border-radius:2px}
.side h3{font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 6px 6px}
.viewer select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.viewer p{margin:6px 6px 0;color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.linkbtn{all:unset;cursor:pointer;color:var(--ink-3);font-size:12px;padding:4px 6px;border-radius:6px}
.linkbtn:hover{color:var(--ink);background:var(--hover)}

/* Main */
.main{overflow:auto;min-width:0}
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding:20px 28px 10px}
.titlebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.titlebar h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;margin-right:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);font-weight:600}
.seg button.on{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;color:var(--ink-2);font-weight:500}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px}
.filters input[type=search]{width:170px}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;padding:0 4px}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.groupby{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);margin-left:auto}

.board{padding:6px 28px 60px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-2)}

/* Groups / table */
.group{margin-top:22px}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.caret{border:0;background:none;width:22px;height:22px;border-radius:5px;color:var(--g);display:grid;place-items:center;padding:0}
.caret:hover{background:var(--hover)}
.caret svg{transition:transform .15s}
.collapsed .caret svg{transform:rotate(-90deg)}
.gname{font-weight:700;font-size:16px;color:var(--g)}
.gname-input{font-weight:700;font-size:16px;color:var(--g);border:1px solid transparent;background:transparent;border-radius:6px;padding:1px 5px;min-width:60px}
.gname-input:hover,.gname-input:focus{border-color:var(--line);background:var(--surface)}
.gcount{color:var(--ink-3);font-size:13px}
.members{display:inline-flex;align-items:center;margin-left:6px}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);border-left:5px solid var(--g)}
.collapsed .tablewrap{display:none}
table{border-collapse:collapse;width:100%;min-width:780px}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.c-item{text-align:left;padding-left:12px}
td{border-bottom:1px solid var(--line);padding:0;height:40px;text-align:center;white-space:nowrap}
td + td, th + th{border-left:1px solid var(--line)}
tr.row:hover td{background:var(--hover)}
td.c-item{text-align:left;width:40%}
.cell-item{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;min-height:40px}
.subrow .cell-item{padding-left:34px}
.subrow td{background:var(--surface-2)}
.subcaret{border:0;background:none;padding:0;width:20px;height:20px;border-radius:4px;color:var(--ink-3);display:grid;place-items:center;flex:none}
.subcaret:hover{background:var(--line)}
.subcaret.open svg{transform:rotate(90deg)}
.spacer{width:20px;flex:none}
.title{all:unset;cursor:pointer;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.title:hover{text-decoration:underline;text-underline-offset:3px}
.title:focus-visible{outline:2px solid var(--accent);border-radius:3px}
.lock{color:var(--ink-3);flex:none;display:inline-flex}
.tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none}
.convo{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--ink-3);font-size:12px;border:0;background:none;padding:3px 5px;border-radius:5px;flex:none}
.convo.has{color:var(--accent)}
.convo:hover{background:var(--line)}
.pill{border:0;width:100%;height:40px;color:#fff;font-weight:600;font-size:13px;padding:0 10px;display:block}
.pill:disabled{cursor:default}
.pill:not(:disabled):hover{filter:brightness(1.08)}
td.c-status{width:132px}
td.c-pri{width:96px}
td.c-due{width:88px;color:var(--ink-2)}
td.c-due.overdue{color:var(--danger);font-weight:700}
td.c-people{width:110px}
td.c-proj{width:150px;color:var(--ink-2);font-size:13px;padding:0 8px;overflow:hidden;text-overflow:ellipsis;max-width:150px}
td.c-link{width:56px}
td.c-link a{color:var(--accent);display:inline-flex}
.avatars{display:inline-flex;align-items:center;justify-content:center}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--surface);margin-left:-6px}
.av:first-child{margin-left:0}
.av.add{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--ink-3);cursor:pointer}
.addrow td{height:38px}
.addrow input{border:0;background:transparent;width:100%;padding:0 12px 0 34px;height:38px;color:var(--ink)}
.addrow input::placeholder{color:var(--ink-3)}
.battery{display:flex;height:10px;border-radius:3px;overflow:hidden;margin:8px 10px;background:var(--line)}
.battery span{display:block;height:100%}
tfoot td{height:auto;border-bottom:0}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;margin-top:18px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--line);display:flex;flex-direction:column;min-height:240px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.colhead{color:#fff;font-weight:700;padding:9px 12px;border-radius:9px 9px 0 0;display:flex;justify-content:space-between}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--ink-3)}
.card.dragging{opacity:.45}
.card .ct{font-weight:600;display:flex;gap:6px;align-items:flex-start}
.card .cm{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-2)}
.card .cp{font-size:12px;color:var(--ink-3);margin-top:3px}
.card .overdue{color:var(--danger);font-weight:700}

/* Panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.28);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
.phead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.phead input.ptitle{flex:1;font-size:20px;font-weight:700;border:1px solid transparent;border-radius:7px;padding:3px 6px;background:none}
.phead input.ptitle:hover,.phead input.ptitle:focus{border-color:var(--line)}
.phead h2{flex:1;margin:3px 6px;font-size:20px}
.x{border:0;background:none;width:32px;height:32px;border-radius:7px;font-size:20px;color:var(--ink-2);flex:none}
.x:hover{background:var(--hover)}
.pbody{overflow:auto;padding:14px 20px 30px;display:flex;flex-direction:column;gap:18px}
.note{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink)}
.fields{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.fields label,.fields .lbl{color:var(--ink-2);font-size:13px}
.fields select,.fields input,.fields textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;width:100%}
.fields input:disabled,.fields select:disabled{opacity:.75}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .av{width:22px;height:22px;font-size:10px;margin:0;border:0}
.sec h4{margin:0 0 8px;font-size:14px}
.subs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sub{display:flex;align-items:center;gap:10px;padding:0 10px 0 0;border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:0}
.sub .pill{width:112px;height:34px;flex:none;font-size:12px}
.sub span{flex:1}
.subs input{border:0;background:transparent;padding:9px 12px;width:100%}
.thread{display:flex;flex-direction:column;gap:10px}
.post{display:flex;gap:10px}
.post .av{margin:0;flex:none}
.post .bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;flex:1}
.post .who{font-weight:700;font-size:13px}
.post .when{color:var(--ink-3);font-size:12px;margin-left:6px;font-weight:400}
.composer{display:flex;flex-direction:column;gap:8px}
.composer textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;min-height:70px;resize:vertical}
.composer .btn{align-self:flex-end}
.hint{color:var(--ink-3);font-size:12px}

/* Menu + toast */
.menu{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:none;flex-direction:column;gap:5px;min-width:170px}
.menu.open{display:flex}
.menu .pill{height:32px;border-radius:6px;width:100%}
.menu .opt{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;display:flex;align-items:center;gap:8px}
.menu .opt:hover{background:var(--hover)}
.menu .opt .av{margin:0;border:0;width:22px;height:22px;font-size:10px}
.prog{display:flex;align-items:center;gap:8px;padding:0 10px}
.prog .bar{flex:1;display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.prog .bar span{display:block;height:100%}
.prog b{font-size:12px;color:var(--ink-2);font-weight:700;min-width:34px;text-align:right}
.rollup .title{font-weight:700}
.privbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.privbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.privtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-weight:600}
.nav h5{margin:10px 8px 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.history{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:10px;padding-left:14px;gap:10px}
.hev{position:relative;font-size:13px;color:var(--ink-2)}
.hev::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--hc,var(--ink-3));border:2px solid var(--surface)}
.hev strong{color:var(--ink);font-weight:600}
.hev .mini{display:inline-block;color:#fff;font-weight:600;font-size:11px;border-radius:4px;padding:1px 6px;margin:0 2px}
.hev .hnote{display:block;margin-top:3px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.hev .ht{display:block;font-size:11px;color:var(--ink-3)}
.review{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.review .rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.review input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px}
.btn.done{background:var(--s-done);border-color:var(--s-done);color:#fff}
.menu .pill:disabled{opacity:.35;cursor:not-allowed}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:36px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.bell:hover{background:var(--hover)}
.bell .badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.menu.notifs{width:min(360px,calc(100vw - 16px));max-height:420px;overflow:auto;gap:2px}
.nitem{border:0;background:none;text-align:left;padding:8px;border-radius:8px;display:flex;gap:9px;align-items:flex-start;width:100%}
.nitem:hover{background:var(--hover)}
.nitem .av{margin:0;border:0;flex:none}
.nitem.unread{background:var(--accent-soft)}
.nitem .nt{font-size:13px;color:var(--ink)}
.nitem .nt em{font-style:normal;color:var(--ink-2)}
.nitem .nw{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.nhead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px;font-weight:700}
.reqbox{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;cursor:pointer}
.ck.on{border-color:var(--accent);background:var(--accent-soft)}
.ck.off{opacity:.5;cursor:not-allowed}
.ck .av{width:20px;height:20px;font-size:9px;margin:0;border:0}
.ck input{margin:0}
#revNote.need{border-color:var(--danger);outline:2px solid var(--danger)}
.misslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;color:var(--ink)}
.mchip .av{width:18px;height:18px;font-size:8px;margin:0;border:0}
.mchip i{font-style:normal;color:var(--ink-3)}
.reqbox .reqform{display:grid;grid-template-columns:1fr auto;gap:8px}
.reqbox #reqNote{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px}
.reqbox input[type=text],.reqbox #reqNote{grid-column:1/-1}
.req{display:flex;align-items:flex-start;gap:8px;font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.req .grow{flex:1}
.asked{background:#FFF4DC;color:#5A4200;border-radius:8px;padding:9px 12px;font-size:13px}
:root[data-theme="dark"] .asked{background:#3A3016;color:#F4E3B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .asked{background:#3A3016;color:#F4E3B5}}
.tag.fb{background:#FFF4DC;color:#7A5A00;border-color:#F0D9A0}
.tag.chg{color:var(--danger)}
.tlseg{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tlseg h4{margin:0}
.seg.small button{padding:4px 9px;font-size:12px}
.hev.postev::before{background:var(--accent)}
.hev.postev .pb{display:block;margin-top:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink)}
.navcount{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
/* Sync page */
.syncsum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:10px}
.syncsum .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.syncsum .muted{color:var(--ink-2)}
.syncsum .btn{margin-left:auto}
.scard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--s-done);border-radius:var(--radius);margin-top:16px;overflow:hidden}
.scard header{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.scard h3{margin:0;font-size:16px}
.scard header .btn{margin-left:auto}
.scard table{min-width:560px}
.scard td{text-align:left;padding:0 12px;height:38px}
.scard td.st{display:flex;align-items:center;gap:8px;height:38px}
.scard .foot{padding:10px 14px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px;background:var(--surface-2)}
.scard .foot b{color:var(--ink)}
.batches{margin-top:26px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script>
/* Settings live in config.js (uploaded once, next to this file). Nothing to paste here. */
const CFG = window.JARVIS_CONFIG || {};
const SUPABASE_URL = CFG.url || 'PASTE_YOUR_PROJECT_URL';
const SUPABASE_ANON_KEY = CFG.anonKey || 'PASTE_YOUR_ANON_KEY';
const LOGIN_DOMAIN = 'jarvis.local';
const APP_VERSION = '0.9';
const APP_DATE = 'Sep 26, 2026';

/* ---------- Dates ---------- */
const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => new Date(s+'T12:00:00');
const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return localISO(d); };
const TODAY = new Date();
const todayISO = () => localISO(new Date());
const dayOff = n => addDays(todayISO(), n);
const wkday = n => { let d=dayOff(n); while([0,6].includes(parseISO(d).getDay())) d=addDays(d, n<0?-1:1); return d; };
const weekStartOf = iso => { const d=parseISO(iso); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return localISO(d); };
const fmtStamp = d => d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const stampAt = (n,h,m) => { const d=new Date(); d.setDate(d.getDate()+n); d.setHours(h,m||0,0,0); return {at:fmtStamp(d),ts:d.getTime()}; };
const nowStamp = () => ({at:fmtStamp(new Date()), ts:Date.now()});
const fmt = d => d ? parseISO(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const fmtDay = d => parseISO(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dow = d => parseISO(d).toLocaleDateString('en-US',{weekday:'short'});
const fmtTime = t => { if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`; };
const endOfWeek = k => { const d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7)+7*k); d.setHours(23,59,0,0); return d; };
function prevWeekday(iso){ let d=addDays(iso,-1); while([0,6].includes(parseISO(d).getDay())) d=addDays(d,-1); return d; }

/* ---------- Constants ---------- */
const STATUSES = [
  {id:'not',label:'Not started',color:'var(--s-not)'},
  {id:'work',label:'Working on it',color:'var(--s-work)'},
  {id:'pause',label:'Paused',color:'var(--s-pause)'},
  {id:'sub',label:'Submitted',color:'var(--s-sub)'},
  {id:'done',label:'Done',color:'var(--s-done)'}
];
const PRI = [{id:'low',label:'Low',color:'var(--p-low)'},{id:'med',label:'Medium',color:'var(--p-med)'},{id:'high',label:'High',color:'var(--p-high)'}];
const MAJORS = ['Video','Photo','Graphic Design','Animation','Web'];
const GCOLORS = ['#00954C','#3F7FD9','#9A7BE0','#E0617A','#EE9E2F','#16A3B8','#7A8C2E','#C2519E'];
const AVCOL = ['#C2519E','#16A3B8','#7A5BD6','#D9772B','#2E8B57','#C0392B','#3F6FD8','#8C6A1F','#B0487A','#1F8A8A','#6A58C9','#C0662A','#3A7D44','#A93A3A','#2F62C4','#7D6420','#9C3F8E','#207C9A','#5E4DB8','#B8582B','#2D7F6B','#8A4FB0','#B24B4B'];
/* People come from the roster (people table) after sign-in */
const PEOPLE = {};
let STUDENTS = [], SENIORS = [], JUNIORS = [];
const SENIOR_YEAR = (()=>{ const d=new Date(); return d.getMonth()>=6 ? d.getFullYear()+1 : d.getFullYear(); })();
const JUNIOR_YEAR = SENIOR_YEAR + 1;
const gradLabel = g => g===SENIOR_YEAR ? 'Senior' : g===JUNIOR_YEAR ? 'Junior' : (g && g<SENIOR_YEAR ? 'Graduated' : 'Student');
const gradFromLabel = l => /senior/i.test(l||'') ? SENIOR_YEAR : /junior/i.test(l||'') ? JUNIOR_YEAR : null;
function hashColor(pid){ let h=0; for(const c of String(pid)) h=(h*31+c.charCodeAt(0))>>>0; return AVCOL[h%AVCOL.length]; }
function setPeople(rows){
  for(const k of Object.keys(PEOPLE)) delete PEOPLE[k];
  for(const r of rows) PEOPLE[r.pid] = {id:r.pid, uid:r.id, username:r.username, name:r.name, role:r.role, grad:r.grad, major:r.major||'', active:r.active, color: r.role==='teacher'?'#095641':hashColor(r.pid)};
  STUDENTS = Object.values(PEOPLE).filter(p=>p.role==='student' && p.active).sort((a,b)=>a.name.localeCompare(b.name));
  SENIORS = STUDENTS.filter(s=>s.grad===SENIOR_YEAR); JUNIORS = STUDENTS.filter(s=>s.grad===JUNIOR_YEAR);
}
const LOCAL_KEY = 'jarvis-prefs';
const TABLES = ['projects','assignments','items','notifs','syncs','asks','lessons','polls','checkins','weeks','settings'];
const APPEND = new Set(['thread','history','readBy','replies','plus','responses']);
const rid = p => p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const HELP_TYPES = {help:'Help with something',equipment:'Equipment',approval:'Approval',other:'Something else'};
const WEEKLY_Q = {
  q1:'What are you going to work on this week? (Any project, assignment, or skill you’re building.)',
  q2:'What do you want to have done or be able to show by the end of the week?',
  q3:'What do you need from Mr. P this week — feedback, equipment, approval, a lesson, help with something?',
  q4:'Are you on track with your Monday plan? If yes, what progress have you made? If no, what got in the way?',
  q5:'Has anything come up this week — in class or outside of it — that is affecting your work?',
  q6:'What did you actually complete or move forward this week? Be specific — name the file, the scene, the design, the shot.',
  q7:'What is one thing you made or tried this week that you are genuinely proud of or curious about?',
  q8:'What did not get done that you planned to do and why?',
  q9:'Did any lesson or conversation this week connect to your goals? If so, how?',
  q10:'What is your first priority when you walk in on Monday?'
};
const STAGES = [
  {id:'monday',label:'Monday game plan',qs:['q1','q2','q3']},
  {id:'mid',label:'Midweek check-in',qs:['q4','q5']},
  {id:'friday',label:'Friday reflection',qs:['q6','q7','q8','q9','q10']}
];

/* ---------- Audience helpers ---------- */
function studentsFor(aud){
  if(!aud) return [];
  if(typeof aud==='string'){ if(aud==='all') return STUDENTS; const [k,v]=aud.split(':'); if(k==='grad') return STUDENTS.filter(s=>s.grad===+v); if(k==='major') return STUDENTS.filter(s=>s.major===v); return []; }
  if(aud.all) return STUDENTS;
  const set=new Set();
  (aud.grads||[]).forEach(g=>STUDENTS.filter(s=>s.grad===g).forEach(s=>set.add(s.id)));
  (aud.majors||[]).forEach(m=>STUDENTS.filter(s=>s.major===m).forEach(s=>set.add(s.id)));
  (aud.students||[]).forEach(id=>set.add(id));
  return STUDENTS.filter(s=>set.has(s.id));
}
function audienceLabel(aud){
  if(!aud) return '';
  if(typeof aud==='string'){ if(aud==='all') return 'Everyone'; const [k,v]=aud.split(':'); return k==='grad'?(+v===SENIOR_YEAR?'Seniors':'Juniors'):v+' majors'; }
  if(aud.all) return 'Everyone';
  const parts=[]; (aud.grads||[]).forEach(g=>parts.push(g===SENIOR_YEAR?'Seniors':g===JUNIOR_YEAR?'Juniors':'Class of '+g)); (aud.majors||[]).forEach(m=>parts.push(m+' majors'));
  if((aud.students||[]).length) parts.push(aud.students.length+' student'+(aud.students.length===1?'':'s'));
  return parts.join(' + ')||'Nobody yet';
}


/* ---------- State ---------- */
let S = {viewer:null, prefs:{timeline:'split',panelW:560}}; TABLES.forEach(t=>S[t]=[]);
try{ const L=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}'); if(L.prefs) S.prefs={...S.prefs,...L.prefs}; }catch(e){}
const UI = {page:'home',view:'table',groupBy:'project',scope:'all',major:'',student:'',overdue:false,dueWeek:false,status:'',filterOpen:false,q:'',project:'',collapsed:new Set(),openSubs:new Set(),panel:null,
  sec:{}, flip:new Set(), mpStudent:'', more:false, helpQ:'', helpOpen:null, wkStudent:'', wkStart:null, homeGrade:'', lastThread:{}, askForm:false, wide:false};
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({prefs:S.prefs})); }catch(e){} }
function save(){ saveLocal(); persist(); }
const nid = ()=> rid('i');

/* ---------- Shared database (Supabase) ---------- */
let sb = null, ready = false, live = false, everLive = false, channel = null;
const shadow = {}; TABLES.forEach(t=>shadow[t]=new Map());
const chains = {};
function niceError(e){ const m=String(e&&e.message||e||''); return m.includes('JARVIS:') ? m.split('JARVIS:')[1].trim() : (/fetch|network/i.test(m)?'No connection — check the Wi-Fi.':'That didn’t save.'); }
async function refetchRow(t,id){
  try{ const {data}=await sb.from(t).select('id,data').eq('id',id).maybeSingle();
    const arr=S[t], ix=arr.findIndex(o=>o.id===id);
    if(data){ const o=normalize(t,data.data); if(ix>=0) arr[ix]=o; else arr.push(o); shadow[t].set(id,JSON.stringify(o)); }
    else { if(ix>=0) arr.splice(ix,1); shadow[t].delete(id); }
    scheduleRender();
  }catch(e){}
}
function write(t,id,op,payload,k){
  const key=t+':'+id;
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    const {error}=await sb.rpc('jarvis_write',{op,tbl:t,rid:id,payload:payload===undefined?null:payload,k:k||null});
    if(error){ console.error(t,id,op,error); toast(niceError(error)); await refetchRow(t,id); }
  }).catch(e=>{ console.error(e); toast(niceError(e)); });
  return chains[key];
}
function persist(){
  if(!sb || !ready || !S.viewer) return;
  for(const t of TABLES){
    const sh = shadow[t], seen = new Set();
    for(const o of S[t]){
      seen.add(o.id);
      const cur = JSON.stringify(o), old = sh.get(o.id);
      if(old === cur) continue;
      if(old === undefined){ write(t,o.id,'put',o); sh.set(o.id,cur); continue; }
      const prev = JSON.parse(old), patch = {};
      for(const k of new Set([...Object.keys(prev),...Object.keys(o)])){
        const a = prev[k], b = o[k];
        if(JSON.stringify(a) === JSON.stringify(b)) continue;
        if(APPEND.has(k) && Array.isArray(a) && Array.isArray(b) && b.length > a.length && JSON.stringify(b.slice(0,a.length)) === JSON.stringify(a))
          write(t,o.id,'append',b.slice(a.length),k);
        else patch[k] = (b === undefined ? null : b);
      }
      if(Object.keys(patch).length) write(t,o.id,'patch',patch);

/* Fill in missing fields so old (v1) rows or half-saved rows can never crash a screen */
function normalize(t,o){

    delete o.members; if(o.private===undefined || o.private===null) o.private=false; arr('thread'); arr('files'); if(!o.color) o.color=GCOLORS[0]; if(!o.name) o.name='Untitled project'; }
  if(t==='items'){ arr('assignees'); arr('files'); arr('thread'); arr('history'); if(!o.status) o.status='not'; if(!o.title) o.title='Untitled';
    if(o.link && !o.files.length) o.files=[{id:'f'+o.id,label:'Submission',versions:[{v:1,url:o.link,by:o.assignees[0]||'t',at:'',ts:0,note:''}]}]; delete o.link; }

  if(t==='lessons'){ arr('signups'); if(!o.seats) o.seats=1; }

}

function applyRemote(t,p){
  const arr = S[t];
  if(p.eventType === 'DELETE'){
    const id = p.old && p.old.id; const ix = arr.findIndex(o=>o.id===id);
    if(ix>=0) arr.splice(ix,1); shadow[t].delete(id);
  } else {
    const o = normalize(t, p.new && p.new.data); if(!o) return;
    const ix = arr.findIndex(x=>x.id===o.id);

    shadow[t].set(o.id,JSON.stringify(o));

function downloadBackup(){
  const data={app:'JARVIS',version:APP_VERSION,exportedAt:new Date().toISOString(),tables:{}};

  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});

  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  const n=TABLES.reduce((k,t)=>k+S[t].length,0); toast(`Backup downloaded (${n} records)`);
}
async function restoreBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('That file isn’t a JARVIS backup'); return; }
  if(!data || data.app!=='JARVIS' || !data.tables){ toast('That file isn’t a JARVIS backup'); return; }
  const when=data.exportedAt?new Date(data.exportedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'an unknown date';
  if(!confirm(`Replace EVERYTHING on the board with the backup from ${when}? All changes since then will be erased. (Student accounts aren’t affected.)`)) return;
  if(prompt('Type RESTORE to confirm')!=='RESTORE'){ toast('Restore canceled'); return; }
  const tables={}; TABLES.forEach(t=>tables[t]=(data.tables[t]||[]).filter(o=>o&&o.id).map(o=>normalize(t,o)));
  const {data:n,error}=await sb.rpc('jarvis_restore',{backup:tables});

}

const childrenOf = id => S.projects.filter(p=>p.parentId===id);
const adminsOf = p => [...new Set([p.owner, ...Object.entries(p.roles||{}).filter(([,r])=>r==='admin').map(([k])=>k)])].filter(k=>k && PEOPLE[k]);
function orderTree(list){ const ids=new Set(list.map(p=>p.id)); const out=[]; list.filter(p=>!p.parentId||!ids.has(p.parentId)).forEach(p=>{ out.push(p); list.filter(c=>c.parentId===p.id).forEach(c=>out.push(c)); }); return out; }
const inView = pid => !!UI.project && !!pid && (pid===UI.project || proj(pid)?.parentId===UI.project);
function sysPost(o,text){ (o.thread=o.thread||[]).push({id:rid('u'),by:S.viewer,text,sys:true,...nowStamp()}); }
function doNest(P,T){ P.parentId=T.id; sysPost(P,`Moved inside “${T.name}”`); sysPost(T,`“${P.name}” is now part of this project`); }
function doUnnest(P){ const T=proj(P.parentId); P.parentId=null; sysPost(P,`Taken back out of “${T?T.name:'a project'}”`); if(T && canEditProject(T)) sysPost(T,`“${P.name}” was taken back out`); }
function doConvert(P,T){
  const all=S.items.filter(i=>i.projectId===P.id);
  const status = all.length && all.every(complete) ? 'done' : all.some(i=>i.status!=='not') ? 'work' : 'not';
  const it={id:nid(),source:'task',title:P.name,description:P.description||'',assignees:Object.entries(P.roles||{}).filter(([k,r])=>r!=='viewer'&&k!=='t').map(([k])=>k),status,due:'',priority:'med',projectId:T.id,parentId:null,
    files:P.files||[],thread:P.thread||[],history:[{kind:'converted',by:S.viewer,from:P.name,...nowStamp()}]};
  S.items.push(it);
  for(const i of all.filter(x=>!x.parentId)){
    const subs=subsOf(i.id);
    i.projectId=T.id; i.parentId=it.id; logEvent(i,{kind:'moved',from:P.name,to:T.name});
    for(const s of subs){ s.projectId=T.id; s.parentId=it.id; s.title=i.title+' — '+s.title; logEvent(s,{kind:'moved',from:P.name,to:T.name}); }
  }
  Object.entries(P.roles||{}).forEach(([k,r])=>{ if(!T.roles[k]) T.roles[k]= r==='viewer'?'viewer':'editor'; });
  S.asks.forEach(a=>{ if(a.projectId===P.id){ a.projectId=T.id; if(!a.itemId) a.itemId=it.id; } if(a.kind==='merge' && a.open && (a.projectId===P.id||a.targetId===P.id)) a.open=false; });
  S.checkins.forEach(c=>{ if((c.active||[]).includes('p:'+P.id)) c.active=c.active.map(k=>k==='p:'+P.id?'i:'+it.id:k); });
  S.projects=S.projects.filter(x=>x!==P);
  sysPost(T,`“${P.name}” was turned into an item in this project`);
  return it;
}

function moveItem(i,T){

function buildGroups(list){

/* ---------- Asks ---------- */
function askTitle(a){

}
function askCardHTML(a,o={}){

  const mergeNote = a.kind==='merge' ? `<div class="hint">${a.mode==='nest'?'Keeps everything as its own group inside the bigger project. Can be undone.':'Becomes one item; its items become subitems. Permanent.'}</div>` : '';

/* ---------- Updates + history ---------- */
function updatesHTML(thread){
  if(!thread.length) return '<div class="hint">No updates yet. Use the box at the bottom to post progress or questions.</div>';
  const sorted=[...thread].sort((a,b)=>tsOf(a)-tsOf(b));
  const groups=[]; for(const t of sorted){ const k=relDay(t.ts); let g=groups.find(x=>x.k===k); if(!g){ g={k,posts:[]}; groups.push(g); } g.posts.push(t); }
  const few = thread.length<=6;
  return groups.map(g=>`<details class="dgroup" data-sec="upd:${g.k}" ${(UI.sec['upd:'+g.k] ?? (few||g.k==='Today'||g.k==='Yesterday'))?'open':''}><summary>${esc(g.k)} <span class="hint">${g.posts.length}</span></summary>
    <div class="thread">${g.posts.map(t=>`<div class="post">${av(t.by)}<div class="bubble"><div class="who">${nameTag(t.by)}<span class="when">${esc(t.at)}</span>${t.by==='t'?speakBtn(t.text):''}</div>${esc(t.text)}</div></div>`).join('')}</div></details>`).join('');
}
function historyHTML(i){
  let h=(i.history||[]).map(e=>({...e}));
  if(S.prefs.timeline==='combined') h = h.concat((i.thread||[]).map(t=>({kind:'post',...t})));
  h.sort((a,b)=>tsOf(a)-tsOf(b));
  if(!h.length) return '<div class="hint">No history yet.</div>';
  const mini = sid => { const s=stat(sid); return `<span class="mini" style="background:${s.color}">${s.label}</span>`; };
  return `<label class="toggle"><input type="checkbox" data-combined ${S.prefs.timeline==='combined'?'checked':''}> Include updates</label><div class="history">${h.map(e=>{
    let txt='', col='var(--ink-3)'; const nm=`<strong>${nameTag(e.by,true)}</strong>`;
    if(e.kind==='post') return `<div class="hev postev">${nm} posted an update<span class="pb">${esc(e.text)}</span><span class="ht">${esc(e.at)}</span></div>`;
    if(e.kind==='created') txt=`${nm} created this`;
    else if(e.kind==='status'){ col=stat(e.to).color; txt = (e.from==='sub'&&e.to!=='done') ? `${nm} returned it for revisions ${mini(e.from)}→${mini(e.to)}` : `${nm} moved it ${mini(e.from)}→${mini(e.to)}`; }
    else if(e.kind==='file') txt=`${nm} ${e.v>1?'added version '+e.v+' of':'added'} <b>${esc(e.label)}</b>`;
    else if(e.kind==='ask') txt=`${nm} asked ${esc(toName(e.to))} for feedback`;
    else if(e.kind==='sync'){ col='var(--s-done)'; txt=`${nm} entered it in Schoology`; }
    else if(e.kind==='missing'){ col='var(--danger)'; txt=`${nm} entered it as missing in Schoology`; }
    else if(e.kind==='assignees') txt=`${nm} changed who’s assigned`;
    else if(e.kind==='moved') txt=`${nm} moved it from <b>${esc(e.from||'?')}</b> to <b>${esc(e.to)}</b>`;
    else if(e.kind==='converted') txt=`${nm} turned the project <b>${esc(e.from)}</b> into this item`;
    else if(e.kind==='due'){ col='var(--s-work)'; txt = !e.from ? `${nm} set the due date to <b>${esc(fmt(e.to))}</b>` : !e.to ? `${nm} removed the due date (was ${esc(fmt(e.from))})` : `${nm} moved the due date <b>${esc(fmt(e.from))} → ${esc(fmt(e.to))}</b>${e.to>e.from?' (later)':' (earlier)'}`; }
    else txt=`${nm} changed ${esc(e.field||'details')}`;
    return `<div class="hev" style="--hc:${col}">${txt}${e.note?`<span class="hnote">“${esc(e.note)}”</span>`:''}<span class="ht">${esc(e.at)}</span></div>`;
  }).join('')}</div>`;
}

/* ---------- Panel ---------- */
function openPanel(key){
  const same = UI.panel===key; UI.panel=key; if(!same) UI.askForm=false;
  const P=$('#panel'); P.classList.add('open'); $('#scrim').classList.add('open');
  if(!same){ P.dataset.for=''; renderFoot(); }
  renderPanel(); if(!same) $('#pbody').scrollTop=0;
}
function closePanel(){ UI.panel=null; UI.askForm=false; $('#panel').classList.remove('open'); $('#scrim').classList.remove('open'); }
function applyPanelWidth(){ const P=$('#panel'); P.style.width = UI.wide ? 'min(1100px,100vw)' : `min(${S.prefs.panelW||560}px,100vw)`; }
function renderFoot(){
  const [k,id]=(UI.panel||':').split(':'); const F=$('#pfoot');
  let can=false; if(k==='i'){ const i=item(id); can = i && canStatus(i); } else if(k==='p'){ const p=proj(id); can = p && canEditProject(p); }
  F.innerHTML = can ? `<textarea id="postText" rows="2" placeholder="Post an update…"></textarea><button class="btn primary" data-post="${UI.panel}">Post</button>` : `<span class="hint">Only the team can post updates here.</span>`;
}
function preserve(container, fn){
  const keep={}; container.querySelectorAll('[data-k]').forEach(el=>{ keep[el.dataset.k]= (el.type==='checkbox'||el.type==='radio')?el.checked:el.value; });
  const checked = new Set([...container.querySelectorAll('input[data-pp="ask"]:checked')].map(x=>x.value)); const all=$('#askAll')?.checked;
  fn();
  container.querySelectorAll('[data-k]').forEach(el=>{ const v=keep[el.dataset.k]; if(v===undefined) return; if(el.type==='checkbox'||el.type==='radio') el.checked=v; else el.value=v; });
  container.querySelectorAll('input[data-pp="ask"]').forEach(x=>{ if(checked.has(x.value)){ x.checked=true; x.closest('.ck').classList.add('on'); } });
  if(all && $('#askAll')){ $('#askAll').checked=true; syncAskAll(); }
}
function renderPanel(){
  if(!UI.panel) return;
  const [k,id]=UI.panel.split(':');
  const obj = k==='i'?item(id):proj(id);
  if(!obj){ closePanel(); return; }
  applyPanelWidth();
  const B=$('#pbody'), st=B.scrollTop;
  const head = k==='i' ? itemHead(obj) : projectHead(obj);
  const hd=$('#phead'); if(!hd.contains(document.activeElement)) hd.innerHTML = head;
  preserve(B, ()=>{ B.innerHTML = k==='i' ? itemBody(obj) : projectBody(obj); });
  B.scrollTop = st;
  const count=(obj.thread||[]).length, prev=UI.lastThread[UI.panel];
  const last=(obj.thread||[])[count-1];
  const nearBottom = B.scrollHeight - B.scrollTop - B.clientHeight < 80;
  if(prev!==undefined && count>prev && last && last.by!==S.viewer && !nearBottom) $('#newpill').hidden=false;
  UI.lastThread[UI.panel]=count;
}
function headButtons(){ return `<button class="x" data-wide aria-label="${UI.wide?'Shrink panel':'Expand panel'}" title="${UI.wide?'Shrink':'Expand'}">${UI.wide?ICON.shrink:ICON.expand}</button><button class="x" data-close aria-label="Close">×</button>`; }
function itemHead(i){ return `${canEdit(i)?`<input class="ptitle" data-f="title" value="${esc(i.title)}" aria-label="Item title">`:`<h2>${esc(i.title)}</h2>`}${headButtons()}`; }
function projectHead(p){ return `${canAdminProject(p)?`<input class="ptitle" data-pf="name" value="${esc(p.name)}" aria-label="Project name">`:`<h2>${esc(p.name)}</h2>`}${headButtons()}`; }

      <label>Due</label><input type="date" data-f="due" value="${i.due||''}" ${ed?'':'disabled'}>

      <span class="lbl">${a?'Audience':'Project'}</span><span>${a?esc(audienceLabel(a.audience))+(a.weekly?' · weekly':''):(p?`<button class="linkbtn" data-open="p:${p.id}">${esc(p.name)}</button>`:'')}</span>
      ${i.source==='task' && !i.parentId && ed ? (()=>{ const opts=S.projects.filter(x=>x.id!==i.projectId && canEditProject(x)); return opts.length?`<span class="lbl">Move to</span><select data-moveitem="${i.id}"><option value="">Another project…</option>${opts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''; })() : ''}

  if(askBtn || asks.length) h += sec('asks','Feedback', askBtn + asks.map(x=>askCardHTML(x)).join(''), true, `<span class="hint">${asks.filter(x=>x.open).length} open</span>`);

function projectBody(p){

  const kids=childrenOf(p.id), parent=p.parentId&&proj(p.parentId);

      <label class="opt"><input type="radio" name="mmode-${p.id}" data-k="mnest:${p.id}" checked><span><b>Put it inside</b> — it becomes a group inside the bigger project and keeps everything: items, updates, files, people. You can take it back out later.</span></label>
      <label class="opt"><input type="radio" name="mmode-${p.id}" data-k="mconv:${p.id}"><span><b>Turn it into an item</b> — it becomes one item in the bigger project and its items become subitems. Updates, files, and history come along. This can’t be undone.</span></label>

      <button class="btn" data-merge="${p.id}" style="align-self:flex-start">Combine</button></div>` : '<div class="hint">No other projects to combine with yet.</div>';
  }
  if(comb) h += sec('pcombine', parent||kids.length?'Combined projects':'Combine with another project', comb, !!(parent||kids.length||pend));
  if(ad) h += `<button class="btn danger" data-delproject="${p.id}" style="align-self:flex-start">Delete project</button>`;
  return h;
}

function pollHTML(q){

    else { const opts = q.kind==='scale'?['1','2','3','4','5']:q.options; const tot=resp.length;

/* ---------- Weekly ---------- */
function weekLogistics(pid,ws){
  const end=addDays(ws,6), inWeek = ts => { const d=localISO(new Date(ts)); return d>=ws && d<=end; };
  const done=[], files=[];
  S.items.forEach(i=>(i.history||[]).forEach(e=>{ if(e.by===pid && inWeek(e.ts)){ if(e.kind==='status'&&e.to==='done') done.push(i.title); if(e.kind==='status'&&e.to==='sub') done.push(i.title+' (submitted)'); if(e.kind==='file') files.push(e.label+(e.v>1?' v'+e.v:'')); } }));
  S.projects.forEach(p=>(p.files||[]).forEach(f=>f.versions.forEach(v=>{ if(v.by===pid && inWeek(v.ts)) files.push(f.label+' v'+v.v); })));
  const lessons = S.lessons.filter(l=>l.date>=ws && l.date<=end && (l.signups||[]).includes(pid)).map(l=>l.title);
  const lines = S.checkins.filter(c=>c.by===pid && c.date>=ws && c.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  return {done:[...new Set(done)],files:[...new Set(files)],lessons,lines};
}

  } else {
    h += `<div class="filters">${nav}${ws===weekStartOf(t) && !(w&&w.stages&&w.stages.friday) && t<lastDayOf(pid,ws) ? `<button class="btn" data-lastday="${t}">Today is the last day of my week</button>`:''}${w&&w.lastDay?`<span class="hint">You set ${esc(dow(w.lastDay))} as your last day.</span>`:''}</div>`;
  }
  h += dayStrip(pid,ws,!isTeacher() && ws===weekStartOf(t));
  const wi=weeklyItem(pid,ws);
  if(isTeacher() && wi) h += `<div class="note">Weekly report status: <b>${stat(wi.status).label}</b>. <button class="btn tiny" data-open="i:${wi.id}">Open to review</button></div>`;
  const due=stageDue(pid,ws), stagesShown = simple ? STAGES.filter(s=>s.id===due) : STAGES;
  h += `<div class="weekgrid"><div>${stagesShown.length?stagesShown.map(s=>stageForm(pid,ws,s,!isTeacher())).join(''):'<div class="empty">You’re all caught up on this week’s questions.</div>'}</div><aside class="weekside"><h3>${isTeacher()?'Their':'Your'} week at a glance</h3>${logisticsHTML(pid,ws)}</aside></div>`;
  return h;
}

/* ---------- Lessons & polls ---------- */
function lessonCard(l){
  const n=(l.signups||[]).length, mine=(l.signups||[]).includes(S.viewer), past=l.date<todayISO();
  return `<div class="lcard ${past?'past':''}"><div class="lhead"><b>${esc(l.title)}</b><span class="hint">${esc(fmtDay(l.date))} · ${esc(fmtTime(l.start))}–${esc(fmtTime(l.end))}</span></div>
    ${l.description?`<div class="desc">${esc(l.description)} ${speakBtn(l.title+'. '+l.description)}</div>`:''}
    <div class="lfoot"><span class="seats"><i style="width:${Math.min(100,n/l.seats*100)}%"></i></span><span class="hint">${n}/${l.seats} seats</span>${avatars(l.signups||[],8)}
      ${isTeacher()?`<button class="linkbtn" data-editlesson="${l.id}">Edit</button><button class="linkbtn" data-dellesson="${l.id}">Delete</button>`:past?'':(mine?`<button class="btn tiny" data-leave="${l.id}">Leave</button>`:(n<l.seats?`<button class="btn tiny primary" data-signup="${l.id}">Sign up</button>`:'<span class="tag">Full</span>'))}</div></div>`;
}
function renderLessons(){
  const t=todayISO();
  const up=S.lessons.filter(l=>l.date>=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const past=S.lessons.filter(l=>l.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  const reqs=S.asks.filter(a=>a.kind==='lesson'&&a.open).sort((a,b)=>(b.plus||[]).length-(a.plus||[]).length);
  const polls=pollsFor(S.viewer).sort((a,b)=>(b.open-a.open)||tsOf(b)-tsOf(a));
  let h = `<div class="hello"><h2>Lessons & polls</h2>${helpDot('lessons')}<span class="grow"></span>${isTeacher()?'<button class="btn primary" data-newlesson>+ New lesson</button><button class="btn" data-newpoll>+ New poll</button>':'<button class="btn primary" data-askkind="lesson">Request a lesson</button>'}</div>`;
  h += `<h3 class="sech">Upcoming lessons</h3>${up.length?`<div class="lgrid">${up.map(lessonCard).join('')}</div>`:'<div class="empty">No lessons scheduled.</div>'}`;
  h += `<h3 class="sech">Lesson requests <span class="hint">+1 the ones you want. Mr. P schedules the popular ones.</span></h3>${reqs.length?reqs.map(a=>askCardHTML(a)).join(''):'<div class="hint">No requests yet.</div>'}`;
  h += `<h3 class="sech">Polls</h3>${polls.length?polls.map(pollHTML).join(''):'<div class="hint">No polls yet.</div>'}`;
  if(past.length) h += `<details class="psec" data-sec="pastlessons"><summary><span class="st">Past lessons</span><span class="hint">${past.length}</span></summary><div class="lgrid">${past.map(lessonCard).join('')}</div></details>`;
  return h;
}

/* ---------- Asks ---------- */
function renderAsks(){
  const v=S.viewer, waiting=asksWaitingOnMe().filter(a=>a.kind!=='lesson');
  const mine=S.asks.filter(a=>a.by===v && a.kind!=='lesson');
  let h=`<div class="hello"><h2>Asks</h2>${helpDot('ask')}<span class="grow"></span><button class="btn primary" data-askmodal>New ask</button></div>`;
  h+=`<h3 class="sech">${isTeacher()?'Waiting on you':'Classmates asking you'}</h3>${waiting.length?waiting.map(a=>askCardHTML(a,{showTarget:true})).join(''):'<div class="hint">Nothing waiting on you.</div>'}`;
  if(!isTeacher()) h+=`<h3 class="sech">Your asks</h3>${mine.filter(a=>a.open).map(a=>askCardHTML(a,{showTarget:true})).join('')||'<div class="hint">No open asks.</div>'}`;
  if(isTeacher()) h+=`<h3 class="sech">All open feedback requests</h3>${S.asks.filter(a=>a.open&&a.kind==='feedback').map(a=>askCardHTML(a,{showTarget:true})).join('')||'<div class="hint">None.</div>'}`;
  const closed=(isTeacher()?S.asks.filter(a=>!a.open&&a.kind!=='lesson'):mine.filter(a=>!a.open));
  if(closed.length) h+=`<details class="psec" data-sec="closedasks"><summary><span class="st">Closed</span><span class="hint">${closed.length}</span></summary>${closed.map(a=>askCardHTML(a,{showTarget:true})).join('')}</details>`;
  return h;
}

/* ---------- Schoology sync ---------- */
function syncReady(){ return S.items.filter(i=>i.source==='assignment' && i.status==='done' && !i.syncId); }
const pastDue = a => a && a.due && new Date(a.due+'T23:59:00') < new Date();
function syncMissing(){ return S.items.filter(i=> i.source==='assignment' && i.status!=='done' && !i.missingId && pastDue(asn(i.assignmentId))); }
const syncPending = ()=> syncReady().length + syncMissing().length;
function doneAt(i){ const e=[...(i.history||[])].reverse().find(e=>e.kind==='status'&&e.to==='done'); return e?e.at:''; }
function renderSync(){
  const ready = syncReady(), missing = syncMissing(), last = S.syncs[S.syncs.length-1];
  const aids = [...new Set([...ready,...missing].map(i=>i.assignmentId))].map(asn).filter(Boolean).sort((a,b)=>a.due.localeCompare(b.due));
  const nm = i => PEOPLE[i.assignees[0]]?.name||'?';
  let h = `<div class="hello"><h2>Schoology sync log</h2></div><div class="syncsum"><span class="big">${ready.length}</span><span class="muted">done to enter</span><span class="big" style="color:var(--danger)">${missing.length}</span><span class="muted">missing to enter<br>since your last sync${last?` (${esc(last.at)})`:''}</span>
    ${ready.length||missing.length?'<button class="btn primary" data-syncall>Mark all synced</button>':''}</div>
    <p class="hint" style="margin:8px 2px 0">Only work you’ve marked Done counts as complete. Anything else past its due date is listed as missing.</p>`;
  if(!aids.length) h += `<div class="empty" style="margin-top:16px">Everything is entered.</div>`;
  for(const a of aids){
    const r = ready.filter(i=>i.assignmentId===a.id).sort((x,y)=>nm(x).localeCompare(nm(y)));
    const m = missing.filter(i=>i.assignmentId===a.id).sort((x,y)=>nm(x).localeCompare(nm(y)));
    h += `<section class="scard"><header><h3>${esc(a.title)}</h3><span class="hint">Due ${fmt(a.due)} · ${esc(audienceLabel(a.audience))}</span><button class="btn" data-syncone="${a.id}">Mark synced</button></header>
      ${r.length?`<div class="tablewrap" style="border:0;border-radius:0"><table><tbody>${r.map(i=>{ const u=latestUrl((i.files||[])[0]); return `<tr><td class="st">${av(i.assignees[0])}<button class="title" data-open="i:${i.id}">${esc(nm(i))}</button></td>
        <td>Done ${esc(doneAt(i))}${i.missingId?' <span class="tag chg">Was entered missing — update grade</span>':''}</td><td>${submitCount(i)>1?`Round ${submitCount(i)}`:'First try'}</td>
        <td>${a.weekly?`<button class="linkbtn" data-openweek="${i.assignees[0]}|${a.weekStart}">Open report</button>`:u?`<a href="${esc(u)}" target="_blank" rel="noopener">Open work</a>`:'<span class="hint">No link</span>'}</td></tr>`; }).join('')}</tbody></table></div>`:''}
      <div class="foot">${m.length?`<span><b style="color:var(--danger)">Missing — enter as missing:</b></span><div class="misslist">${m.map(i=>`<button class="mchip" data-open="i:${i.id}">${av(i.assignees[0])}${esc(nm(i))}${i.status==='sub'?' <i>(submitted, not reviewed)</i>':''}</button>`).join('')}</div>`:''}
        ${!pastDue(a)?`<span>Not due yet.</span>`:(!m.length?'<span>No missing work.</span>':'')}</div></section>`;
  }
  if(S.syncs.length) h += `<div class="batches"><h3>Previous syncs</h3>${[...S.syncs].sort((a,b)=>tsOf(b)-tsOf(a)).map(b=>`<div class="batch"><span>${esc(b.at)}</span><span class="hint">${b.count} done${b.missing?`, ${b.missing} missing`:''} entered</span></div>`).join('')}</div>`;
  return h;
}
function markSynced(aidFilter){
  const r = syncReady().filter(i=>!aidFilter||i.assignmentId===aidFilter), m = syncMissing().filter(i=>!aidFilter||i.assignmentId===aidFilter);
  if(!r.length && !m.length) return;
  const b={id:rid('b'),...nowStamp(),count:r.length,missing:m.length}; S.syncs.push(b);
  for(const i of r){ i.syncId=b.id; logEvent(i,{kind:'sync'}); }
  for(const i of m){ i.missingId=b.id; logEvent(i,{kind:'missing'}); }
  toast(`Marked synced: ${r.length} done, ${m.length} missing`); render();
}

function askModal(kind){

function shrinkImage(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d'); const s=Math.min(im.width,im.height); g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96); let u=c.toDataURL('image/webp',.82); if(!u.startsWith('data:image/webp')) u=c.toDataURL('image/jpeg',.82); res(u); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

/* ---------- Marking period: major / minor / micro ---------- */
const LEVELS=[['major','Major'],['minor','Minor'],['micro','Micro']];
const levelLabel = l => (LEVELS.find(x=>x[0]===l)||['','—'])[1];
function mpConfig(){ return S.settings.find(x=>x.id==='mp_config') || {id:'mp_config',start:'2026-08-18',length:45,targets:{major:1,minor:5,micro:3}}; }
function ensureMpConfig(){ let c=S.settings.find(x=>x.id==='mp_config'); if(!c){ c=JSON.parse(JSON.stringify(mpConfig())); S.settings.push(c); } return c; }
function schoolDays(start,n){ const out=[]; let d=start; while(out.length<n){ const k=parseISO(d).getDay(); if(k!==0&&k!==6) out.push(d); d=addDays(d,1); } return out; }
function currentMp(){
  const c=mpConfig(), len=Math.max(5,+c.length||45); let start=c.start, num=1, days;
  for(let g=0; g<12; g++){ days=schoolDays(start,len); const end=days[days.length-1]; if(todayISO()<=end || g===11) return {num,start,end,days,id:'mp_'+start,dayNum:Math.max(0,days.filter(d=>d<=todayISO()).length)}; start=addDays(end,1); num++; }
}
const claimId = (pid,key) => `claim_${pid}_${key.replace(':','-')}`;
const claimsOf = pid => S.settings.filter(x=>x.id.startsWith('claim_') && x.by===pid);
const claimFor = (pid,key) => S.settings.find(x=>x.id===claimId(pid,key));
function targetOf(key){ const [k,id]=key.split(':'); return k==='p'?proj(id):item(id); }
function targetTitle(key){ const o=targetOf(key); if(!o) return '(deleted)'; if(key.startsWith('p:')) return o.name; const p=o.projectId&&proj(o.projectId); return o.title+(p?` · ${p.name}`:''); }
function relatedKeys(key){
  const [k,id]=key.split(':'), out=new Set();
  if(k==='p'){ S.items.filter(i=>i.projectId===id).forEach(i=>out.add('i:'+i.id)); return out; }
  const i=item(id); if(!i) return out;
  if(i.projectId) out.add('p:'+i.projectId);
  if(i.parentId) out.add('i:'+i.parentId);
  subsOf(id).forEach(s=>out.add('i:'+s.id));
  return out;
}
function conflictFor(pid,key){ const rel=relatedKeys(key); return claimsOf(pid).find(c=>rel.has(c.target)); }
function mpTree(pid){
  const projs=S.projects.filter(p=>(p.roles||{})[pid] || S.items.some(i=>i.projectId===p.id && i.assignees.includes(pid)));
  return orderTree(projs).map(p=>({key:'p:'+p.id,title:p.name,kids:S.items.filter(i=>i.projectId===p.id && !i.parentId && (i.assignees.includes(pid) || subsOf(i.id).some(s=>s.assignees.includes(pid))))
    .map(i=>({key:'i:'+i.id,title:i.title,kids:subsOf(i.id).filter(s=>s.assignees.includes(pid)).map(s=>({key:'i:'+s.id,title:s.title,kids:[]}))}))}));
}
const canTag = pid => isTeacher() || pid===S.viewer;
const statusTag = c => ({planned:'<span class="tag">Planned</span>',submitted:'<span class="tag wait">Waiting for Mr. P</span>',returned:'<span class="tag chg">Sent back</span>',credited:'<span class="tag ok">Counted</span>'})[c.status]||'';
function mpRow(pid,node,depth){
  const c=claimFor(pid,node.key), conf=!c && conflictFor(pid,node.key);
  const locked = c && ['submitted','credited'].includes(c.status);
  const dis = !canTag(pid) || locked || !!conf;
  const open = node.key.startsWith('p:')?node.key:'i:'+node.key.slice(2);
  let h=`<div class="mprow d${depth} ${c?'tagged lv-'+c.level:''}">
    <button class="title" data-open="${open}">${esc(node.title)}</button>
    <select data-mplevel="${pid}|${node.key}" ${dis?'disabled':''} aria-label="Counts as">
      <option value="">${conf?'Counted in '+esc(targetTitle(conf.target).split(' · ')[0]):'Not counting'}</option>
      ${LEVELS.map(([k,l])=>`<option value="${k}" ${c&&c.level===k?'selected':''}>${l}</option>`).join('')}</select>
    ${c?`<input class="mprole" data-mprole="${c.id}" value="${esc(c.role||'')}" placeholder="Your role, e.g. Director" ${canTag(pid)&&!locked?'':'disabled'}>${statusTag(c)}`:''}
  </div>`;
  return h + node.kids.map(k=>mpRow(pid,k,depth+1)).join('');
}
function shelfHTML(pid,mp){
  const t=mpConfig().targets, got=claimsOf(pid).filter(c=>c.status==='credited' && c.mp===mp.id);
  return `<div class="shelf">${LEVELS.map(([k,l])=>{ const mine=got.filter(c=>c.level===k), empty=Math.max(0,(+t[k]||0)-mine.length);

}

function renderMpFor(pid,mp){
  const claims=claimsOf(pid), open=claims.filter(c=>c.status!=='credited');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let REC = null, recEl = null, recBtn = null;
const MIC_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>';
function attachMics(root){
  if(!SR) return;
  (root||document).querySelectorAll('textarea, input[data-voice]').forEach(el=>{
    if(el.dataset.mic || el.disabled || el.readOnly || el.type==='hidden') return;
    el.dataset.mic='1';
    const w=document.createElement('span'); w.className='micwrap'+(el.tagName==='TEXTAREA'?' ta':'');
    el.parentNode.insertBefore(w,el); w.appendChild(el);
    const b=document.createElement('button'); b.type='button'; b.className='micbtn'; b.title='Talk to type'; b.setAttribute('aria-label','Talk to type'); b.innerHTML=MIC_SVG;
    b.addEventListener('mousedown',ev=>ev.preventDefault());
    b.addEventListener('click',ev=>{ ev.preventDefault(); ev.stopPropagation(); toggleMic(el,b); });
    w.appendChild(b);
  });
}
function stopMic(){ if(REC){ try{ REC.stop(); }catch(e){} } }
function toggleMic(el,btn){
  if(REC && recEl===el){ stopMic(); return; }
  stopMic();
  const rec=new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true;
  el.focus();
  const start=el.selectionStart ?? el.value.length, end=el.selectionEnd ?? el.value.length;
  const before=el.value.slice(0,start), after=el.value.slice(end);
  const pad = before && !/\s$/.test(before) ? ' ' : '';
  let finalText='';
  rec.onresult=e=>{
    let interim='';
    for(let k=e.resultIndex;k<e.results.length;k++){ const r=e.results[k]; if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript; }
    let spoken=(finalText+interim).replace(/^\s+/,'');
    if(!before.trim() || /[.!?]\s*$/.test(before)) spoken=spoken.charAt(0).toUpperCase()+spoken.slice(1);
    el.value=before+pad+spoken+after;
    const pos=(before+pad+spoken).length; try{ el.setSelectionRange(pos,pos); }catch(x){}
    el.dispatchEvent(new Event('input',{bubbles:true}));
  };
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Allow the microphone to use voice typing'); else if(e.error==='no-speech') toast('Didn’t hear anything — try again'); };
  rec.onend=()=>{ btn.classList.remove('on'); if(REC===rec){ REC=null; recEl=null; recBtn=null; } el.dispatchEvent(new Event('change',{bubbles:true})); };
  try{ rec.start(); }catch(e){ toast('Voice typing couldn’t start'); return; }
  REC=rec; recEl=el; recBtn=btn; btn.classList.add('on'); toast('Listening… tap the mic again to stop');
}
new MutationObserver(()=>{ clearTimeout(attachMics._t); attachMics._t=setTimeout(()=>attachMics(document),30); }).observe(document.body,{childList:true,subtree:true});

const TTS = 'speechSynthesis' in window;
const SPK_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const speakBtn = text => (TTS && text && String(text).trim()) ? `<button class="speak" data-speak="${esc(String(text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}" title="Read aloud" aria-label="Read aloud">${SPK_SVG}</button>` : '';
let speakingBtn=null;
function speak(text,btn){
  if(!TTS) return;
  const was=speakingBtn; speechSynthesis.cancel(); if(was){ was.classList.remove('on'); speakingBtn=null; if(was===btn) return; }
  const u=new SpeechSynthesisUtterance(text); u.rate=.95; u.lang='en-US';
  u.onend=u.onerror=()=>{ if(speakingBtn===btn){ btn.classList.remove('on'); speakingBtn=null; } };
  speakingBtn=btn; btn.classList.add('on'); speechSynthesis.speak(u);
}

async function adminCall(body){
  const {data,error}=await sb.functions.invoke('jarvis-admin',{body});
  if(error){ let msg=error.message||'Something went wrong.'; try{ const j=await error.context.json(); if(j&&j.error) msg=j.error; }catch(e){}
    const st=error.context&&error.context.status;
    if(/Failed to send/i.test(msg)) msg='Couldn’t reach the account helper (jarvis-admin). It may be missing, misnamed, or crashing — check Edge Functions > jarvis-admin > Logs.';
    else if(st===404) msg='No Edge Function named “jarvis-admin” was found. Check the exact name.';
    else if(st===401) msg='The account helper rejected the sign-in ('+msg+'). Try signing out and back in.';
    console.error('jarvis-admin error', error, st); throw new Error(msg); }
  if(data && data.error) throw new Error(data.error);
  return data;
}

/* --- spreadsheet reading --- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* Built-in .xlsx reader (no outside download needed): unzips with the browser and reads the sheet XML */
async function unzip(buf){
  const dv=new DataView(buf), dec=new TextDecoder(); let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error('That file isn’t a readable .xlsx file.');
  const n=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true); const files={};
  for(let k=0;k<n;k++){ const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    files[dec.decode(new Uint8Array(buf,p+46,nl))]={method,csize,lho}; p+=46+nl+el+cl; }
  return async name=>{ const f=files[name]; if(!f) return null; const start=f.lho+30+dv.getUint16(f.lho+26,true)+dv.getUint16(f.lho+28,true); const data=new Uint8Array(buf,start,f.csize);
    if(f.method===0) return dec.decode(data);
    const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer(); return dec.decode(out); };
}
const colIdx = ref => { let n=0; for(const ch of String(ref).replace(/[0-9]/g,'')) n=n*26+(ch.charCodeAt(0)-64); return n-1; };
async function readXlsx(buf){
  const get=await unzip(buf), X=s=>new DOMParser().parseFromString(s,'application/xml');
  const wb=X(await get('xl/workbook.xml')), rels=X(await get('xl/_rels/workbook.xml.rels'));
  const sheets=[...wb.getElementsByTagName('sheet')].map(s=>({name:s.getAttribute('name'),rid:s.getAttribute('r:id')}));
  const pick=sheets.find(s=>/roster/i.test(s.name))||sheets[0];
  const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===pick.rid);
  let path=rel.getAttribute('Target'); path=path.startsWith('/')?path.slice(1):'xl/'+path.replace(/^\.\//,'');
  const ssx=await get('xl/sharedStrings.xml');
  const strings=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const rows=[];
  for(const r of X(await get(path)).getElementsByTagName('row')){ const row=[];
    for(const c of r.getElementsByTagName('c')){ const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0];
      row[colIdx(c.getAttribute('r'))] = t==='s' ? (strings[+(v&&v.textContent)]||'') : t==='inlineStr' ? [...c.getElementsByTagName('t')].map(x=>x.textContent).join('') : (v?v.textContent:''); }
    rows.push(Array.from(row,x=>x??'')); }
  return rows;
}
function loadSheetJS(){ return window.XLSX ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('Couldn’t load the spreadsheet reader')); document.head.appendChild(s); }); }
async function readRosterFile(file){
  let rows;
  if(/\.csv$/i.test(file.name)) rows=parseCSV(await file.text());
  else if(/\.xlsx$/i.test(file.name)){
    const buf=await file.arrayBuffer();
    try{ rows=await readXlsx(buf); }
    catch(e){ console.error('built-in xlsx reader', e);
      try{ await loadSheetJS(); const wb=XLSX.read(buf,{type:'array'}); const ws=wb.Sheets['Roster']||wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); }
      catch(e2){ throw new Error('Couldn’t read that spreadsheet. In Excel or Google Sheets, save it as CSV and import the CSV instead.'); } }
  }
  else throw new Error('Pick the .xlsx roster file (or a .csv).');
  const hi=rows.findIndex(r=>r.some(c=>/first/i.test(String(c))) && r.some(c=>/last/i.test(String(c))));
  if(hi<0) throw new Error('Couldn’t find the “First name” and “Last name” columns.');
  const H=rows[hi].map(c=>String(c).toLowerCase());
  const col=re=>H.findIndex(h=>re.test(h));
  const cf=col(/first/), cl=col(/last/), cg=col(/grade|year/), cm=col(/major/), cu=col(/user/);
  return rows.slice(hi+1).map(r=>({first:String(r[cf]??'').trim(), last:String(r[cl]??'').trim(), grade:String(cg>=0?r[cg]:'').trim(), major:String(cm>=0?r[cm]:'').trim(), username:String(cu>=0?r[cu]:'').trim()})).filter(r=>r.first||r.last);
}

  if(d.rp!==undefined){ const r=RIMP[+d.rp]; if(r){ r[d.f]= d.f==='username'?cleanUser(t.value):t.value.trim(); drawPreview(); } return; }
  if(t.id==='restoreFile'){ const f=t.files&&t.files[0]; t.value=''; if(f && isTeacher()) restoreBackup(f); return; }
  if(t.id==='mpStudent'){ UI.mpStudent=t.value; render(); return; }
  if(d.mplevel){ const [pid,key]=d.mplevel.split('|'); if(!canTag(pid)) return; const id=claimId(pid,key); const ex=S.settings.find(x=>x.id===id);
    if(!t.value){ if(ex && ['submitted','credited'].includes(ex.status)){ render(); return; } S.settings=S.settings.filter(x=>x.id!==id); render(); return; }
    if(!ex && conflictFor(pid,key)){ toast('Already counted in a related item'); render(); return; }
    if(ex) ex.level=t.value; else S.settings.push({id,by:pid,target:key,level:t.value,role:'',status:'planned',...nowStamp()});
    render(); if(!ex) setTimeout(()=>$(`[data-mprole="${id}"]`)?.focus(),30); return; }
  if(d.mprole){ const c=S.settings.find(x=>x.id===d.mprole); if(c){ c.role=t.value.trim().slice(0,80); render(); } return; }
  if(d.mpcfg){ const c=ensureMpConfig(); const v=t.value; if(d.mpcfg==='start'){ if(v) c.start=v; } else if(d.mpcfg==='length'){ c.length=Math.max(5,Math.min(120,+v||45)); } else { c.targets={...c.targets,[d.mpcfg]:Math.max(0,Math.min(20,+v||0))}; } render(); return; }
  if(t.id==='askAll'){ syncAskAll(); return; }
  if(d.moveitem){ const i=item(d.moveitem), T=proj(t.value); if(!i||!T) return; if(!confirm(`Move “${i.title}”${subsOf(i.id).length?' and its subitems':''} to “${T.name}”?`)){ t.value=''; return; }
    const r=moveItem(i,T); render(); toast(`Moved to “${T.name}”`+(r.added.length?` · added ${r.added.map(first).join(', ')} to it`:'')+(r.missing.length?` · ask its admin to add ${r.missing.map(first).join(', ')}`:'')); return; }
  if(t.id==='prFile' && t.files && t.files[0]){ shrinkImage(t.files[0]).then(u=>{ PR.img=u; PR.clearImg=false; drawPrPrev(); }).catch(()=>toast('Couldn’t read that image')); return; }
  if(t.id==='audAll' || t.classList.contains('audGrad') || t.classList.contains('audMajor')){
    t.closest('.ck')?.classList.toggle('on',t.checked);
    if(t.id==='audAll' && t.checked){ $$('.audGrad,.audMajor,input[data-pp="aud"]').forEach(x=>{ x.checked=false; x.closest('.ck')?.classList.remove('on'); }); }
    else if(t.checked){ const all=$('#audAll'); all.checked=false; all.closest('.ck').classList.remove('on'); }
    updAudCount(); return; }
  if(d.combined!==undefined){ S.prefs.timeline=t.checked?'combined':'split'; render(); return; }
  if(d.f && UI.panel && UI.panel.startsWith('i:')){ const i=item(UI.panel.slice(2)); if(i) setField(i,d.f,t.value); return; }
  if(d.pf && UI.panel && UI.panel.startsWith('p:')){ const p=proj(UI.panel.slice(2)); if(!p) return; const v=d.pf==='name'?(t.value.trim()||'Untitled project'):t.value; p[d.pf]=v; render(); return; }
  if(d.pp){ const [k,id]=d.pp.split(':'); t.closest('.ck')?.classList.toggle('on',t.checked);
    if(k==='assign'){ const i=item(id); if(t.checked){ if(!i.assignees.includes(t.value)){ i.assignees.push(t.value); if(t.value!==S.viewer) notify(t.value,'assigned',{itemId:i.id}); } } else i.assignees=i.assignees.filter(x=>x!==t.value); logEvent(i,{kind:'assignees'}); render(); }
    else if(k==='roles'){ const p=proj(id); if(t.checked){ if(!p.roles[t.value]){ p.roles[t.value]='editor'; if(t.value!==S.viewer) notify(t.value,'added',{projectId:p.id}); } } else if(t.value!==p.owner) delete p.roles[t.value]; render(); }
    else if(k==='aud'){ if(t.checked){ const all=$('#audAll'); all.checked=false; all.closest('.ck').classList.remove('on'); } updAudCount(); }
    return; }
  if(d.pprole){ const p=proj(d.pprole.split(':')[1]); if(p && d.pid!==p.owner){ p.roles[d.pid]=t.value; render(); } return; }
  if(d.sdays){ const pid=UI.wkStudent||(STUDENTS[0]&&STUDENTS[0].id); if(!pid) return; const w=ensureWeek(pid,UI.wkStart); let days=weekDays(pid,UI.wkStart); days = t.checked?[...new Set([...days,d.sdays])]:days.filter(x=>x!==d.sdays); w.days=days.sort(); if(!w.days.length){ toast('Keep at least one day'); w.days=[d.sdays]; } syncWeeklyDue(UI.wkStart); render(); return; }
  if(d.cdays){ const id='week_'+UI.wkStart; let c=S.settings.find(x=>x.id===id); const all=[0,1,2,3,4].map(k=>addDays(UI.wkStart,k)); if(!c){ c={id,days:all}; S.settings.push(c); } c.days = t.checked?[...new Set([...(c.days||all),d.cdays])].sort():(c.days||all).filter(x=>x!==d.cdays); if(!c.days.length){ c.days=[d.cdays]; toast('Keep at least one day'); } syncWeeklyDue(UI.wkStart); render(); toast('Class week updated · report due '+dow(classLastDay(UI.wkStart))); return; }
  if(d.block){ const c=ensureCheckin(S.viewer,todayISO()); if(d.block.startsWith('c:')){ const x=c.custom.find(y=>'c:'+y.id===d.block); if(x) x[d.edge]=t.value; } else { c.blocks[d.block]={...(c.blocks[d.block]||{}),[d.edge]:t.value}; } render(); return; }
});
let wqTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fSearch'){ UI.q=t.value; const B=$('#board'); B.innerHTML=pageHTML(); return; }
  if(t.id==='helpSearch'){ UI.helpQ=t.value; $('.helplist').outerHTML = (()=>{ const tmp=document.createElement('div'); tmp.innerHTML=renderHelp(); return tmp.querySelector('.helplist').outerHTML; })(); return; }
  if(t.dataset.wq){ const w=ensureWeek(S.viewer,t.dataset.ws); w.answers[t.dataset.wq]=t.value; clearTimeout(wqTimer); wqTimer=setTimeout(()=>persist(),800); return; }
  if(t.id==='revNote') t.classList.remove('need');
  if(t.id==='prText'){ PR.text=t.value; drawPrPrev(); return; }
});

/* Drag and drop (kanban) + panel resize */
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('[data-card]'); if(!c) return; dragId=c.dataset.card; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
document.addEventListener('dragend',e=>{ const c=e.target.closest&&e.target.closest('[data-card]'); if(c) c.classList.remove('dragging'); $$('.col.drop').forEach(x=>x.classList.remove('drop')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('[data-col]'); if(!col||!dragId) return; e.preventDefault(); $$('.col.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('[data-col]'); if(!col||!dragId) return; e.preventDefault(); const i=item(dragId); if(i&&canStatus(i)) changeStatus(i,col.dataset.col); dragId=null; render(); });
(function(){ let startX=0,startW=0,drag=false; const R=$('#resizer');
  R.addEventListener('pointerdown',e=>{ drag=true; startX=e.clientX; startW=$('#panel').offsetWidth; R.setPointerCapture(e.pointerId); UI.wide=false; });
  R.addEventListener('pointermove',e=>{ if(!drag) return; const w=Math.max(380,Math.min(window.innerWidth-40,startW+(startX-e.clientX))); S.prefs.panelW=w; $('#panel').style.width=w+'px'; });
  R.addEventListener('pointerup',()=>{ if(drag){ drag=false; saveLocal(); } });
})();

boot();


</script>
