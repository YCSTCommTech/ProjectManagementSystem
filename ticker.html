#logo.off{display:none}
#win{flex:1;overflow:hidden;position:relative;height:100%}

<script src="config.js" onerror="void 0"></script>
</head>
<body>
<div id="bar"><div id="logo"></div><div id="win"><div id="track"></div></div></div>
<script>
const $=id=>document.getElementById(id), root=document.documentElement.style;
const D={text:'Welcome to York Tech – College & Career Ready\nGo Spartans!',speed:140,size:5.2,bar:'#005746',txt:'#ffffff',sep:'•',logo:true,t:0};
const q=new URLSearchParams(location.search);
if(q.has('clean'))document.body.classList.add('clean');
if(q.has('text'))D.text=q.get('text').split('|').join('\n');
if(q.has('speed'))D.speed=+q.get('speed')||D.speed;
if(q.has('size'))D.size=+q.get('size')||D.size;
if(q.has('bar'))D.bar='#'+q.get('bar').replace('#','');
if(q.has('txt'))D.txt='#'+q.get('txt').replace('#','');
if(q.has('sep'))D.sep=q.get('sep');
if(q.get('logo')==='0')D.logo=false;

let last='';
function build(){
 const sig=JSON.stringify(D);if(sig===last)return;last=sig;
 root.setProperty('--bar',D.bar);root.setProperty('--txt',D.txt);root.setProperty('--fs',D.size+'vh');
 $('logo').classList.toggle('off',!D.logo);
 const items=String(D.text).split('\n').map(s=>s.trim()).filter(Boolean);
 if(!items.length)items.push('TEXT HERE');
 const mk=()=>{const c=document.createElement('div');c.className='copy';
  items.forEach(t=>{const a=document.createElement('span');a.textContent=t;c.appendChild(a);
   const s=document.createElement('span');s.textContent=D.sep;c.appendChild(s);});return c;};
 const track=$('track');track.style.animation='none';track.innerHTML='';
 const probe=mk();track.appendChild(probe);
 const w=probe.getBoundingClientRect().width||1;
 const reps=Math.max(1,Math.ceil($('win').clientWidth/w));
 track.innerHTML='';
 const unit=document.createElement('div');unit.className='copy';
 for(let i=0;i<reps;i++)unit.append(...mk().childNodes);
 track.appendChild(unit);track.appendChild(unit.cloneNode(true));
 const uw=unit.getBoundingClientRect().width||1;
 void track.offsetWidth;
 track.style.animation='scroll '+(uw/D.speed)+'s linear infinite';
}
function apply(c){
 if(!c||typeof c!=='object')return;
 Object.assign(D,c);build();
}
/* JARVIS: read today's lines from the database every 10 s. Keeps scrolling the last lines if the internet drops. */
const CFG=window.JARVIS_CONFIG||{};
async function pull(){
 if(!CFG.url||!CFG.anonKey)return;
 try{
  const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/jarvis_ticker',{method:'POST',headers:{'apikey':CFG.anonKey,'Authorization':'Bearer '+CFG.anonKey,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
  if(!r.ok)return; const j=await r.json(); if(!j)return;
  const st=j.style||{}, lines=(j.lines||[]);
  const c={text:lines.join('\n')};
  ['speed','size','bar','txt','sep','logo'].forEach(k=>{ if(st[k]!==undefined&&st[k]!==''&&!q.has(k))c[k]=st[k]; });
  if(c.speed)c.speed=+c.speed; if(c.size)c.size=+c.size;
  if(!q.has('text'))apply(c);
 }catch(e){}
}
pull(); setInterval(pull,10000);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{last='';build()},150)});
build();
</script>
